- type: Features
  data:
  - name: Arabic-First No-Code Store Builder
    description: Storefront builder with Arabic-first UX, RTL support, and localized payment, shipping, and tax integrations
      built for the GCC market.
  - name: Salla Merchant API
    description: REST API at https://api.salla.dev/admin/v2 covering products, orders, customers, branches, brands,
      categories, currencies, languages, coupons, taxes, abandoned carts, shipping, and store settings.
  - name: OAuth 2.0 Partners Authorization
    description: OAuth 2.0 authorization with 14-day access tokens and 1-month refresh window; scoped per app via the
      Partners Portal.
  - name: Webhooks with Conditional Rules
    description: HMAC SHA-256 signed webhooks (X-Salla-Signature / X-Salla-Security-Strategy headers) for order, product,
      customer, shipping, shipment, store, category, brand, abandoned-cart, coupon, invoice, special offer, and review
      events — with per-subscription conditional rules.
  - name: Twilight Theme Engine and SDK
    description: JavaScript SDK plus Twig-based theme engine with pre-built web components (cart, checkout, login,
      search, product display) for storefront customization.
  - name: Salla CLI
    description: Command-line tool for scaffolding, developing, and publishing Salla apps and themes to the Partners
      Portal.
  - name: Shipping App Contract
    description: A Shipping and Fulfillment API contract that lets logistics providers plug directly into the Salla
      shipment flow.
  - name: ZATCA E-Invoicing
    description: First-class support for Saudi Arabia's ZATCA (Fatoora) e-invoicing QR code requirement via the
      official open-source PHP package.
  - name: Embedded SDK and Apps Marketplace
    description: Embedded SDK lets partner apps render inside the merchant dashboard; the Salla App Store distributes
      third-party apps to 80,000+ stores.
  - name: Saudi Payments and Logistics
    description: Native integrations with STC Pay, mada, Apple Pay, Tabby, Tamara, HyperPay, Mada Pay, Aramex, SMSA,
      DHL, J&T, and other regional payment and logistics providers.
- type: UseCases
  data:
  - name: Custom Merchant Apps
    description: Build custom apps published in the Salla App Store that extend merchant capabilities — inventory sync,
      order routing, marketing automation, ERP integration.
  - name: ERP and Accounting Integrations
    description: Sync orders, products, customers, and invoices to SAP, Oracle NetSuite, Odoo, Zoho Books, QuickBooks,
      or custom accounting systems.
  - name: Custom Storefronts and Themes
    description: Build custom Twilight themes or headless storefronts that render Salla catalog and checkout through
      a fully custom front end.
  - name: Shipping Provider Onboarding
    description: Logistics companies expose their pickup, label printing, tracking, and return surface as a Salla
      Shipping App to serve every merchant on the platform.
  - name: Marketing and CRM Automation
    description: Subscribe to customer, order, and abandoned-cart webhooks to drive CRM, email, SMS, and WhatsApp
      campaigns through Mailchimp, Klaviyo, or in-house automation.
  - name: AI Shopping Assistants
    description: Use the Merchant API plus Naftiko capabilities to power AI agents that browse catalog, place orders,
      track shipments, and respond to merchant questions.
  - name: ZATCA Compliance
    description: Generate the Saudi ZATCA Phase-1 / Phase-2 e-invoicing QR code on every receipt to remain compliant
      with Saudi Arabian tax authority requirements.
- type: Integrations
  data:
  - name: STC Bank
    description: Native STC Bank digital wallet payment option across all Salla-powered stores.
  - name: Tabby and Tamara
    description: Buy-now-pay-later integrations widely used in the GCC market.
  - name: Apple Pay and mada
    description: Apple Pay and the Saudi mada national payment network.
  - name: HyperPay and Moyasar
    description: Regional payment gateways supporting cards, wallets, and bank transfers.
  - name: Aramex, SMSA, J&T, DHL
    description: Pre-built shipping integrations for Saudi Arabia and GCC delivery.
  - name: ZATCA
    description: Saudi Arabian Zakat, Tax and Customs Authority e-invoicing.
  - name: WhatsApp Business
    description: Customer notifications and conversational commerce.
  - name: Mailchimp and Klaviyo
    description: Email and customer marketing automation.
  - name: Snapchat and TikTok Pixels
    description: Storefront pixels and conversion tracking for GCC-focused ad platforms.
- type: Solutions
  data:
  - name: Sellers
    description: Merchants of any size launching an online store with Arabic-first UX, regional payments, and built-in
      logistics.
  - name: Partners
    description: Developers and agencies building apps, themes, and integrations distributed through the Salla
      Partners Portal and App Store.
  - name: Shipping Companies
    description: Logistics providers offering their service to 80,000+ merchants by implementing the Salla Shipping
      App contract.
  - name: Enterprise
    description: Larger brands needing custom themes, dedicated infrastructure, and bespoke commercial terms.
