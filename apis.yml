position: Producing
description: >-
  Salla is a Saudi Arabia-based e-commerce platform — often called the Shopify of the Middle East — that lets merchants
  launch, operate, and grow Arabic-first online stores without code. Founded in 2016 in Makkah by Nawaf Hariri and
  Salman Butt, Salla now powers more than 80,000 active stores. The platform exposes a Merchant REST API
  (https://api.salla.dev/admin/v2), an OAuth 2.0 Partners authorization service, signed webhooks for the full storefront
  lifecycle, a Shipping and Fulfillment app contract, the Twilight theme engine and JavaScript SDK, the Salla CLI, and
  official starter kits for PHP/Laravel and Node.js/Express. Backed by Sanabil (PIF), STV, Investcorp, Vision Ventures,
  and Raed Ventures, Salla raised a $130M pre-IPO round in 2024.
