    type: Documentation
  - type: SDKs
    url: https://github.com/SallaApp/theme-raed
  description: >-
    JavaScript SDK and Twig-based theme engine for the storefront. Provides helper methods and REST proxies
    that let merchant themes and embedded components communicate with the Salla backend, plus a library
    of pre-built web components (login, search, product display, cart, checkout).
