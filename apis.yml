- aid: salla:salla-webhooks
  name: Salla Webhooks
  tags:
  - E-Commerce
  - Event
  - Webhook
  tags_raw:
  - E-Commerce
  - Events
  - Webhooks
  humanURL: https://docs.salla.dev/421119m0
  properties:
  - url: https://docs.salla.dev/421119m0
    type: Documentation
  - url: https://docs.salla.dev/433804m0
    name: Orders Webhook Events Model
    type: Documentation
  - url: openapi/salla-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    Server-to-server event delivery covering order, product, customer, shipping, shipment, store branch,
    category, brand, abandoned cart, coupon, invoice, special offer, and review lifecycle events. Payloads
    are signed via HMAC SHA-256 — X-Salla-Security-Strategy and X-Salla-Signature headers (or token strategy
    with Authorization header) — and developers can attach conditional rules per subscription.
