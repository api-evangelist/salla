description: |
  Reconciled commercial plans for the Salla e-commerce platform. Pricing is published in SAR on salla.com.
  Salla offers a tiered subscription model plus a free trial; transaction fees apply when using Salla's first-party
  payment service (Salla Pay). Partner apps (separately) follow their own pricing in the Salla App Store.
sources:
- https://salla.com/pricing
- https://salla.com
plans:
- id: salla-trial
  name: Free Trial
  type: trial
  description: 15-day free trial to evaluate the storefront builder and basic features.
  entries:
  - label: Trial seat
    name: trial
    type: free
    metric: store
    limit: 1
    timeFrame: 15-day
    geo: SA
    unit: 1
    price: '0.00'
    userMultiplied: false
