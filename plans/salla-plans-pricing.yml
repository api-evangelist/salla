notes:
- The Merchant API itself is included with every paid plan; there is no separate API subscription.
- Salla Pay (first-party payments) and Salla Logistics (first-party fulfillment) charge transaction-level fees
  beyond the base subscription.
- Pricing shown is the published Saudi Arabia (SAR) rate; international or partner-routed pricing may differ.
