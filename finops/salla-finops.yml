description: |
  FOCUS-aligned FinOps definition for the Salla e-commerce platform. Salla's commercial surface combines a flat
  monthly SaaS subscription with optional usage-based services (Salla Pay payment processing, Salla Logistics
  fulfillment) and partner-app charges billed through the Salla App Store on the merchant's invoice.
sources:
- https://salla.com/pricing
- https://docs.salla.dev/
