  unit: transaction
  aggregation: sum
  dimensions:
  - payment_method
  - currency
  - amount_bucket
- name: shipment_fee
  unit: shipment
  aggregation: sum
  dimensions:
  - courier
  - origin
  - destination
- name: app_marketplace_charge
  unit: app_install
  aggregation: sum
  dimensions:
  - app
  - partner
  - plan
costAllocation:
  byPlan: Allocate subscription cost by Salla plan tier (Special, Advanced, Pro, Enterprise).
  byMerchant: Allocate transaction and shipment fees by merchant store identifier.
  byApp: Allocate App Store charges by installed partner app.
notes:
- The Salla Merchant API itself is not billed per call; it is bundled with each paid subscription.
- Transaction fees are charged only when the merchant uses Salla Pay; native gateway integrations (mada, STC Pay,
  HyperPay, Moyasar) have their own fee schedules billed directly by the payment provider.
- Salla Logistics fees follow the courier's published rate sheet plus a platform margin.
- Partner-app subscriptions and one-off purchases from the Salla App Store appear as separate line items on the
  merchant invoice.
